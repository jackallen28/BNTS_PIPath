# PiPath activity catalogue
# Every activity shown on the home screen is listed here, in order.
# Students can open ANY ready activity at any time. Tiers are a guide (colour + filter),
# not a lock.
#
# status = "ready"   -> a lesson file exists in data/lessons/<id>.toml and can be played
# status = "planned" -> shown as "Coming soon"
# try_first = [ids]  -> optional tip on the card: "Good to try first: ..." (hidden once those are done)
# gpio = true        -> card says "needs GPIO kit"; camera = true -> "needs camera"
# curriculum = [..]  -> Victorian Curriculum Digital Technologies Levels 9-10 links ("Strand: what students do")
# stretch = [..]     -> "Level up" challenges for Year 9-10 students, done after the activity
#
# support describes the gradual release of responsibility across the lesson:
#   guided     - starter code with blanks, hints available straight away
#   scaffolded - step-by-step instructions, hints unlock after one try
#   brief      - just the goal and the checks, hints unlock after two tries

[[tier]]
id = "simple"
title = "Simple"
tagline = "Python on the screen"
description = "Print, variables, input, decisions and loops."

[[tier]]
id = "moderate"
title = "Moderate"
tagline = "Bigger programs"
description = "Lists, dictionaries, functions, files and graphics."

[[tier]]
id = "computer"
title = "Pi & Computer"
tagline = "Hardware that talks to the computer"
description = "Show the Pi's own numbers on LEDs, and make buttons and sensors control the computer."

[[tier]]
id = "advanced"
title = "Advanced"
tagline = "Electronics with GPIO"
description = "Control LEDs, buttons, buzzers and sensors with gpiozero."

[[tier]]
id = "lab"
title = "Electronics Lab"
tagline = "Extra hardware projects"
description = "More lights and inputs. Do them in any order."

[[tier]]
id = "camera"
title = "Camera & AI"
tagline = "See and learn"
description = "Take photos with a camera, then teach the Pi to recognise things."

# ---------------------------------------------------------------- SIMPLE
[[project]]
id = "s1_hello"
tier = "simple"
title = "Hello, Pi!"
subtitle = "Your first program, and your first bug hunt"
concepts = ["print()", "text (strings)", "comments", "reading errors"]
curriculum = [
    "Creating Digital Solutions: a sequence of print() statements, and debugging syntax errors from clues",
    "Creating Digital Solutions: validate a program by comparing what it prints with what you planned",
]
stretch = [
    "Plan your text art in structured English first (\"line 1: the hat\"), then trace it line by line before you run it.",
    "Store your picture in a list of strings and print it with a for loop. Add a named constant SCALE that repeats each character to make it bigger.",
    "Write a function banner(text) that prints any message inside a box of * that fits its length. Test it with three different words.",
]
minutes = 15
support = "guided"
status = "ready"

[[project]]
id = "s2_pibot"
tier = "simple"
title = "Meet PiBot"
subtitle = "A chatbot that asks questions and remembers answers"
concepts = ["variables", "input()", "f-strings", "int()"]
curriculum = [
    "Creating Digital Solutions: a chatbot with variables, input(), f-strings and int() to change data types",
    "Data and Information: text and numbers are different types of data, and input needs checking before you use it",
    "Creating Digital Solutions: validate the program with test cases that find the input() + 1 bug",
]
stretch = [
    "Validate the age with try/except so typing \"twelve\" asks again instead of crashing. Keep asking until it's a sensible number (5 to 120).",
    "Put PiBot's questions in a list of dictionaries (question, key) and loop through it, saving every answer in one dictionary.",
    "Move the age maths into a function next_year(age) and check it with assert next_year(13) == 14 before PiBot starts chatting.",
]
minutes = 20
support = "guided → scaffolded"
try_first = ["s1_hello"]
status = "ready"

[[project]]
id = "s3_guess"
tier = "simple"
title = "Guess My Number"
subtitle = "A game with a secret, some clues and a loop"
concepts = ["import random", "if / elif / else", "while loops", "counters"]
curriculum = [
    "Creating Digital Solutions: design an algorithm with selection (if / elif / else) and iteration (a while loop)",
    "Creating Digital Solutions: validate the game by tracing it with test cases: too low, too high and correct",
]
stretch = [
    "Write the game as structured English first, then trace it by hand with secret = 37 and guesses 50, 25, 37. Does a real run match your trace?",
    "Validate each guess with try/except and a range check, so \"abc\" or 500 gets a friendly message and doesn't count as a try.",
    "Write computer_guess(secret) that uses binary search to find any number from 1 to 100 in 7 tries or fewer. Prove it with assert for every secret.",
]
minutes = 30
support = "scaffolded → brief"
try_first = ["s2_pibot"]
status = "ready"

