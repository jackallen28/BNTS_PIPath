title = "Photo Booth"
subtitle = "Press the button, watch the 3-2-1 countdown, smile!"
concepts = ["camera", "Button", "LED countdown", "functions", "datetime file names"]
curriculum = [
    "Digital Systems: a button, LEDs, a buzzer and a camera working together under software control",
    "Creating Digital Solutions: decompose the booth into functions (countdown, photo_strip), testing each part",
    "Data and Information: name photos with datetime so no data is overwritten, and get consent before taking them",
]
stretch = [
    "Design the booth for a real event: write two user stories (\"As a guest, I want...\"), then change the countdown or messages to meet them.",
    "Make COUNTDOWN_SECONDS and PHOTOS_PER_STRIP named constants, and log each strip to photos.csv. Print how many strips were taken today.",
    "Hold the button (when_held) to delete the newest photo, so guests stay in control of their own pictures.",
]
minutes = 45
support = "guided → brief"
status = "ready"
gpio = true
camera = true
try_first = ["a1_traffic"]
parts = ["USB webcam or Raspberry Pi camera", "red, amber, green LEDs + 3 x 330Ω", "1 push button", "active buzzer", "breadboard + jumper wires"]

[[project]]
id = "c2_teachable"
tier = "camera"
title = "Teachable Machine"
subtitle = "Teach the Pi to tell two things apart: real machine learning"
concepts = ["images are numbers", "training data", "nearest neighbour", "functions that return", "accuracy + bias"]
curriculum = [
    "Data and Information: images are numbers: acquire, label and store training data as JSON",
    "Creating Digital Solutions: nearest neighbour built from functions that return values, tested for accuracy",
    "Creating Digital Solutions: evaluate the solution for bias, and the risks when machine learning sorts people",
]
stretch = [
    "Write classify() in structured English first, then trace it by hand with three tiny 2 × 2 examples. Does your answer match the code?",
    "Make it k-nearest neighbours: let the 3 closest examples vote. Use your accuracy test to compare k = 3 with k = 1.",
    "Save each test result to results.csv and print a confusion table (how often each thing was guessed as each thing). Which mistake happens most?",
]
minutes = 65
support = "scaffolded → brief"
status = "ready"
gpio = true
camera = true
try_first = ["c1_photobooth"]
parts = ["USB webcam or Raspberry Pi camera", "green + red LEDs + 2 x 330Ω", "1 push button", "breadboard + jumper wires", "two things to show the camera"]

[[project]]
id = "c3_waste_sorter"
tier = "camera"
title = "Waste Sorter"
subtitle = "Train a camera, code a classifier and steer a servo sorting gate"
concepts = ["labelled training data", "nearest neighbour", "held-out testing", "LEDs", "servo control"]
curriculum = ["Data and Information: collect labelled images and evaluate predictions on unseen items", "Creating Digital Solutions: build and test a classifier and a physical sorting system", "Digital Systems: connect a USB camera, two LEDs and a positional servo"]
stretch = ["Add an unsure result that leaves the gate centred.", "Record a confusion table and compare accuracy after retraining."]
minutes = 120
support = "guided → brief"
status = "ready"
gpio = true
camera = true
try_first = ["c1_photobooth", "c2_teachable"]
parts = ["USB webcam", "red and green LEDs + two 330Ω resistors", "one positional hobby servo + teacher-approved external supply", "breadboard + jumper wires", "cardboard gate + two labelled bins", "clean waste and recycling samples"]
