title = "Build your sorting gate"
support = "brief"
starter_mode = "replace"
run_mode = "until_stopped"
text = '''
**Your task:** Join the tested parts. With teacher help fit a light cardboard pointer, leaving space for both movements. Check +0.5 points towards recycling and -0.5 towards waste BEFORE placing items. Swap the sign in code or move the bin labels if needed. Fill the blank with the condition for recycling. Run with both groups: green and right for recycling; red and left for waste. The gate returns to centre, then releases. This is a supervised pointer, not a load-bearing trapdoor. Type q to quit, or Stop. Test new items and keep a human checking each prediction.
'''
starter = '''
from gpiozero import LED, Servo
from time import sleep
from pipath_camera import Camera
import json

cam = Camera()

with open("waste_examples.json") as f:
    examples = json.load(f)

def distance(a, b):
    total = 0
    for x, y in zip(a, b):
        total = total + abs(x - y)
    return total

def classify(pixels):
    """Find the example that looks most like these pixels, and return its label."""
    best_label = None
    best_distance = None
    for ex in examples:
        d = distance(pixels, ex["pixels"])
        if best_distance is None or d < best_distance:
            best_distance = d
            best_label = ex["label"]
    return best_label

def snap():
    """Take a 16 x 16 picture and join its rows into one list of 256 numbers."""
    grid = cam.capture_grid(16, 16)
    pixels = []
    for row in grid:
        pixels = pixels + row
    return pixels

with LED(22) as green, LED(17) as red, Servo(18, initial_value=None) as gate:
    try:
        while True:
            command = input("Place one item, then Enter to sort (q to quit): ").strip().lower()
            if command == "q":
                break
            guess = classify(snap())
            print("Prediction:", guess)
            green.value = guess == "recycling"
            red.value = guess == "waste"
            gate.value = 0.5 if ___ else -0.5
            sleep(1)
            gate.value = 0
            sleep(0.5)
            gate.detach()
            green.off()
            red.off()
    finally:
        green.off()
        red.off()
        gate.detach()
print("Sorter stopped")
'''
