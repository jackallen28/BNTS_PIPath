text = '''
**Your task:** Collect five waste and five recycling pictures. Use several clean items in each group and vary their angle. Keep the same plain background for both groups so the Pi learns the items, not the backdrop. Each Enter captures one picture; wait for its next prompt. This replaces only waste_examples.json in this activity. In the Simulator choose Ball for waste, then Box for recycling. Fill the blank with examples to save your training set.
'''
starter = '''
from pipath_camera import Camera
from time import sleep
import json
cam = Camera()
examples = []
for label in ("waste", "recycling"):
    for number in range(5):
        input(f"Show {label} sample {number + 1}, then press Enter: ")
        sleep(1)  # keep the item still while the camera settles
        pixels = []
        for row in cam.capture_grid(16, 16):
            pixels = pixels + row
        examples.append({"label": label, "pixels": pixels})
with open("waste_examples.json", "w") as f:
    json.dump(___, f)
print("Saved", len(examples), "training examples")
'''
