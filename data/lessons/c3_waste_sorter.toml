id = "c3_waste_sorter"
title = "Waste Sorter"
file_name = "waste_sorter.py"
requires_gpio = true
requires_camera = true
intro = """
## Build a learning sorting gate
Train a USB camera to tell your clean waste samples from your recycling samples. Code a nearest-neighbour classifier, then use two LEDs and a positional servo to point a cardboard gate towards the matching bin. Everything stays on this Pi and works offline.
Start in the Simulator. **Ball means waste; Box means recycling** in this practice world. These are pretend labels, not real recycling rules. On your Pi, click the camera title and choose **USB**. Ask your teacher which clean items belong in each local bin. Never use sharp, dirty or hazardous rubbish.
You will test each part, collect your own examples, code the prediction, test unseen items and join the parts together. Allow two or three lessons.
"""
outro = """
## Test, improve, explain
Your machine compares tiny greyscale pictures. It does not understand materials or local recycling rules. Similar shapes, new objects, shadows and a changed background can fool it. Keep a person checking every decision. Use only clean demonstration items, not real waste processing.
Try more examples of different items, angles and lighting. Keep test items out of training. Compare the accuracy before and after retraining. Explain which mistakes matter most and why. Challenge: add an unsure result that keeps the gate centred when matches are too similar.
"""
