part = "USB camera"
connect = "Plug into USB. Click the camera panel title and select USB on the real Pi. Keep it fixed above a plain background."
[[wiring]]
part = "Recycling LED"
wire_steps = ["Connect GPIO22 (physical pin 15) to one end of a 330Ω resistor.", "Connect the other end of that resistor to the green LED long leg (+).", "Connect the green LED short leg (−) to GND (physical pin 6, or the common GND rail)."]
kind = "led"
pin = 22
colour = "green"
connect = "GPIO22 (physical pin 15) → 330Ω resistor → green LED long leg. Short leg → GND."
[[wiring]]
part = "Waste LED"
wire_steps = ["Connect GPIO17 (physical pin 11) to one end of a second 330Ω resistor.", "Connect the other end of this resistor to the red LED long leg (+).", "Connect the red LED short leg (−) to the same GND rail. Each LED needs its own resistor."]
kind = "led"
pin = 17
colour = "red"
connect = "GPIO17 (physical pin 11) → 330Ω resistor → red LED long leg. Short leg → GND."
[[wiring]]
part = "Sorting servo"
wire_steps = ["Use a positional hobby servo. Ask your teacher to choose a regulated external supply matched to its voltage and current rating. Keep the supply disconnected while wiring.", "Connect the servo signal wire to GPIO18 (physical pin 12). Check your servo wire colours with your teacher.", "Connect external supply positive to the servo power wire. Do not connect it to any Pi power or GPIO pin. Do not power the motor from GPIO or 3V3.", "Connect external supply negative to servo ground AND Pi GND (physical pin 6). The separate supply and Pi must share a ground.", "Ask your teacher to check the connections before replacing the blue HAT and reconnecting the external supply. Test the bare arm first; keep fingers clear. Fit a light cardboard pointer only after this test."]
kind = "servo"
pin = 18
connect = "Use a positional hobby servo, not continuous rotation. Signal → GPIO18 (physical pin 12). Teacher supplies a separate regulated supply rated for the servo: positive → servo power, negative → servo ground AND Pi GND (physical pin 6). Never join external positive to the Pi power pins. Never power a servo from GPIO or 3V3. Check the servo's wire colours and voltage with your teacher."
[[wiring]]
part = "Before moving"
connect = "Take the blue HAT off before changing wires; do not turn the Pi off. Disconnect the external servo supply while rewiring. Teacher checks before reconnecting. Test the bare servo first; fit a light cardboard gate only afterwards. Keep fingers clear. Start with small movements; stop if the gate jams or the servo buzzes."

