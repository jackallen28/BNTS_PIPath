text = '''
**Your task:** The nearest neighbour is the training picture with the smallest sum of pixel differences. Fill the blank with best_distance. Run with both kinds of item. Your training file from the last step is needed; Watch the goal uses separate practice examples. A guess is a prediction, not proof that an item is recyclable.
'''
starter = '''
from pipath_camera import Camera
import json

cam = Camera()

with open("waste_examples.json") as f:
    examples = json.load(f)

def distance(a, b):
    total = 0
    for x, y in zip(a, b):
        total = total + abs(x - y)
    return total

def classify(pixels):
    """Find the example that looks most like these pixels, and return its label."""
    best_label = None
    best_distance = None
    for ex in examples:
        d = distance(pixels, ex["pixels"])
        if best_distance is None or d < ___:
            best_distance = d
            best_label = ex["label"]
    return best_label

def snap():
    """Take a 16 x 16 picture and join its rows into one list of 256 numbers."""
    grid = cam.capture_grid(16, 16)
    pixels = []
    for row in grid:
        pixels = pixels + row
    return pixels

guess = classify(snap())
print("Prediction:", guess)
'''
